<div class="container mt-5">
  <div class="card p-4">
    <h1>Mascota</h1>

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" placeholder="Nombre de la mascota"
        [(ngModel)]="nombre">
    </div>

    <div class="mb-3">
      <label class="form-label">Edad</label>
      <input type="number" class="form-control" placeholder="Edad" [(ngModel)]="edad">
    </div>

    <button class="btn btn-success w-100" (click)="guardar()">
      {{ editandoId ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="container mt-5">
  <h2>Listado de Mascotas</h2>

  <table class="table table-striped table-bordered mt-3">
    <thead class="table-light">
      <tr>
        <th>id</th>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of mascotas">
        <td>{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td>{{ m.edad }}</td>
        <td>
          <button class="btn btn-info btn-sm me-2" (click)="editar(m)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminar(m.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
